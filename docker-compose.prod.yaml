version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: d-studio-backend
    restart: always
    environment:
      - PORT=3001
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:-http://localhost}
      - SWIFTPAY_MODE=${SWIFTPAY_MODE:-live}
      - SWIFTPAY_API_BASE_URL=${SWIFTPAY_API_BASE_URL:-https://api.pay.live.swiftpay.ph}
      - SWIFTPAY_API_KEY=${SWIFTPAY_API_KEY:-}
      - SWIFTPAY_API_SECRET=${SWIFTPAY_API_SECRET:-}
      - SWIFTPAY_WEBHOOK_SECRET=${SWIFTPAY_WEBHOOK_SECRET:-}
      - SWIFTPAY_SUCCESS_URL=${SWIFTPAY_SUCCESS_URL:-}
      - SWIFTPAY_FAILURE_URL=${SWIFTPAY_FAILURE_URL:-}
      - SWIFTPAY_CANCEL_URL=${SWIFTPAY_CANCEL_URL:-}
      - TZ=UTC
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - d-studio-net

  site:
    image: nginx:1.27-alpine
    container_name: d-studio-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment and configure SSL certificates if using HTTPS
      # - /path/to/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - TZ=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - d-studio-net

networks:
  d-studio-net:
    driver: bridge
