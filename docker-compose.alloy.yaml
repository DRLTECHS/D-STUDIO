services:
  site:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.alloy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
