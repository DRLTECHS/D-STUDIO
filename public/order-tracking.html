<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Order Tracking - DRL Techs">
    <title>Order Tracking — DRL Techs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root { --ink:#121417; --paper:#f4f4f1; --muted:#888c93; --line:#2c3036; --accent:#e8c547; --panel:#191c20; }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { background:var(--ink); color:var(--paper); font-family:Manrope,Arial,sans-serif; margin:0; }
      body::before { background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px); background-size:48px 48px; content:""; inset:0; pointer-events:none; position:fixed; z-index:-1; }
      a { color:inherit; }
      button,input { font:inherit; }
      .mono { font-family:"Space Mono",monospace; }
      .frame { margin:auto; max-width:1440px; padding:0 60px; }
      .eyebrow { align-items:center; color:var(--muted); display:flex; font:11px/1.4 "Space Mono",monospace; gap:12px; letter-spacing:.08em; text-transform:uppercase; }
      .eyebrow::after { background:var(--line); content:""; height:1px; width:130px; }
      .dot { background:var(--accent); border-radius:99px; box-shadow:0 0 12px #e8c547aa; display:inline-block; height:8px; width:8px; }
      .button { align-items:center; background:var(--accent); border:1px solid var(--accent); color:#121417; cursor:pointer; display:inline-flex; font:700 11px "Space Mono",monospace; gap:10px; justify-content:center; letter-spacing:.08em; min-height:44px; padding:0 25px; text-decoration:none; text-transform:uppercase; transition:background .2s,color .2s; }
      .button:hover { background:#f7d95b; }
      .button--secondary { background:transparent; border:1px solid var(--accent); color:var(--accent); }
      .button--secondary:hover { background:var(--accent); color:var(--ink); }
      header { align-items:center; display:flex; height:76px; justify-content:space-between; }
      .brand { align-items:center; display:flex; gap:12px; text-decoration:none; }
      .brand-mark { align-items:center; border:1px solid #5f5225; color:var(--accent); display:grid; font-size:15px; height:24px; place-items:center; transform:rotate(45deg); width:24px; }
      .brand-mark span { transform:rotate(-45deg); }
      .brand-name { font:800 20px "Space Mono",monospace; letter-spacing:.14em; }
      .studio { border-left:1px solid var(--line); color:#70757c; font:11px "Space Mono",monospace; letter-spacing:.06em; padding-left:12px; }
      .brand-copy { align-items:center; display:flex; gap:14px; }
      nav { display:flex; gap:32px; }
      nav a { color:#a8adb4; font:11px "Space Mono",monospace; letter-spacing:.08em; text-decoration:none; text-transform:uppercase; }
      nav a:hover { color:var(--accent); }
      h1 { font-size:clamp(35px,4vw,58px); letter-spacing:-.065em; line-height:1; margin:36px 0 24px; }
      h2 { font-size:20px; letter-spacing:-.05em; margin:32px 0 16px; font-weight:700; }
      h3 { font-size:16px; letter-spacing:-.04em; margin:24px 0 12px; font-weight:600; }
      p { color:#a8adb4; font:13px/1.75 "Space Mono",monospace; margin:0 0 16px; line-height:1.7; }
      .content { padding:80px 0; }
      .order-card { background:var(--panel); border:1px solid var(--line); padding:32px; margin:32px 0; }
      .order-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--line); }
      .order-id { font:700 14px "Space Mono",monospace; }
      .order-status { padding:6px 12px; border-radius:2px; font:700 11px "Space Mono",monospace; text-transform:uppercase; }
      .status-pending { background:#ffa500; color:var(--ink); }
      .status-processing { background:#4a9eff; color:white; }
      .status-shipped { background:#ffa500; color:var(--ink); }
      .status-delivered { background:var(--accent); color:var(--ink); }
      .status-paid { background:var(--accent); color:var(--ink); }
      .order-info { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:24px; margin-bottom:32px; }
      .info-block { background:var(--ink); border:1px solid var(--line); padding:16px; }
      .info-label { color:var(--accent); font:10px "Space Mono",monospace; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
      .info-value { font:13px "Space Mono",monospace; }
      .timeline { margin:32px 0; }
      .timeline-item { display:flex; gap:20px; margin-bottom:24px; position:relative; }
      .timeline-item::before { content:""; position:absolute; left:15px; top:40px; width:2px; height:calc(100% + 8px); background:var(--line); }
      .timeline-item:last-child::before { display:none; }
      .timeline-dot { width:32px; height:32px; border-radius:50%; border:2px solid var(--line); background:var(--panel); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; position:relative; z-index:1; }
      .timeline-dot.active { border-color:var(--accent); background:rgba(232,197,71,.1); }
      .timeline-content { flex:1; }
      .timeline-title { font:600 14px "Space Mono",monospace; margin-bottom:4px; }
      .timeline-date { color:#858a92; font:11px "Space Mono",monospace; }
      .items-list { background:var(--ink); border:1px solid var(--line); padding:16px; margin:16px 0; }
      .item-row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); font:12px "Space Mono",monospace; }
      .item-row:last-child { border-bottom:none; }
      .divider { height:1px; background:var(--line); margin:24px 0; }
      .shipping-info { background:var(--ink); border:1px solid var(--line); padding:16px; margin:16px 0; }
      .search-section { background:var(--panel); border:1px solid var(--line); padding:24px; margin:32px 0; }
      .search-form { display:flex; gap:12px; margin-top:16px; }
      .search-form input { flex:1; padding:12px; background:var(--ink); border:1px solid var(--line); color:var(--paper); }
      .search-form button { padding:12px 24px; }
      .git-log { background:#171a1e; border:1px solid var(--line); margin:16px 0; }
      .git-log-bar { border-bottom:1px solid var(--line); color:#9fa4aa; font:10px "Space Mono",monospace; padding:12px 15px; display:flex; gap:8px; align-items:center; }
      .git-log-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); }
      .git-log-body { color:#a6aaae; font:11px/1.8 "Space Mono",monospace; padding:16px; }
      .git-log-entry { margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
      .git-log-entry:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
      .git-log-hash { color:var(--accent); font-weight:700; }
      .git-log-message { color:#a6aaae; margin:4px 0; }
      .git-log-meta { color:#858a92; font:10px "Space Mono",monospace; margin-top:4px; }
      @keyframes blink { 0%, 50% { opacity:1; } 51%, 100% { opacity:0; } }
      footer { border-top:1px solid var(--line); padding:32px 0; margin-top:80px; }
      .footer-row { align-items:center; color:#7f848b; display:flex; font:10px "Space Mono",monospace; justify-content:space-between; text-transform:uppercase; gap:32px; flex-wrap:wrap; }
      .footer-links { display:flex; gap:22px; }
      .footer-links a { text-decoration:none; }
      @media (max-width:800px) { .frame { padding:0 20px; } header { height:70px; } nav,.studio { display:none; } h1 { font-size:clamp(28px,10vw,42px); margin:24px 0 16px; } .content { padding:40px 0; } .order-header { flex-direction:column; align-items:flex-start; } .search-form { flex-direction:column; } }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <a class="brand" href="/" aria-label="DRL Techs home"><span class="brand-mark"><span>✦</span></span><span class="brand-copy"><strong class="brand-name">DRL TECHS</strong><span class="studio">// Software Trading</span></span></a>
        <nav aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="products.html">Products</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>

      <main class="content">
        <h1>Order Tracking</h1>
        <p class="eyebrow"><span class="dot"></span>Track Your Shipment</p>

        <!-- Search Section -->
        <div class="search-section">
          <h2>Search for Your Order</h2>
          <p>Enter your Order ID to track your shipment and view delivery status</p>
          <div class="search-form">
            <input type="text" id="searchOrderId" placeholder="e.g., DRL-1234567890" onkeypress="if(event.key==='Enter') searchOrder()">
            <button class="button" onclick="searchOrder()">Search Order</button>
          </div>
        </div>

        <div id="orderContent"></div>
      </main>

      <footer>
        <div class="footer-row">
          <div>
            <a class="brand" href="/"><span class="brand-mark"><span>✦</span></span><strong class="brand-name" style="font-size:14px;">DRL TECHS</strong></a>
            <p style="color:#7f848b;font:10px 'Space Mono',monospace;margin:8px 0 0;">Brgy. Bulilan Norte Pila Laguna Philippines 4010</p>
          </div>
          <div class="footer-links">
            <a href="/">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
            <a href="ndf-agreement.html">NDA</a>
          </div>
        </div>
      </footer>
    </div>

    <script>
      const orderStages = {
        pending: [
          { stage: 'Order Confirmed', icon: '✓', description: 'Your order has been received' }
        ],
        paid: [
          { stage: 'Payment Received', icon: '💳', description: 'Payment confirmed' },
          { stage: 'Processing', icon: '⚙️', description: 'Preparing your order' }
        ],
        processing: [
          { stage: 'Payment Received', icon: '💳', description: 'Payment confirmed' },
          { stage: 'Processing', icon: '⚙️', description: 'Preparing your order' },
          { stage: 'Ready to Ship', icon: '📦', description: 'Your order is ready' }
        ],
        shipped: [
          { stage: 'Payment Received', icon: '💳', description: 'Payment confirmed' },
          { stage: 'Processing', icon: '⚙️', description: 'Preparing your order' },
          { stage: 'Ready to Ship', icon: '📦', description: 'Your order is ready' },
          { stage: 'In Transit', icon: '🚚', description: 'On the way to you' }
        ],
        delivered: [
          { stage: 'Payment Received', icon: '💳', description: 'Payment confirmed' },
          { stage: 'Processing', icon: '⚙️', description: 'Preparing your order' },
          { stage: 'Ready to Ship', icon: '📦', description: 'Your order is ready' },
          { stage: 'In Transit', icon: '🚚', description: 'On the way to you' },
          { stage: 'Delivered', icon: '✅', description: 'Successfully delivered' }
        ]
      };

      function generateMockTimeline(order) {
        const stages = orderStages[order.status] || orderStages.pending;
        const now = new Date(order.createdAt);
        
        return stages.map((stage, index) => {
          const stageDate = new Date(now);
          stageDate.setHours(stageDate.getHours() + (index * 6));
          
          return {
            ...stage,
            date: stageDate.toISOString(),
            isActive: index < stages.length - 1 || order.status === stages.length
          };
        });
      }

      function renderOrder(order) {
        const statusClass = `status-${order.status}`;
        const timeline = generateMockTimeline(order);
        const subtotal = order.items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const tax = subtotal * 0.12;
        const shipping = subtotal > 5000 ? 0 : 500;

        const html = `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-id">Order #${order.orderId}</div>
                <p style="color:#858a92; margin:4px 0 0; font:11px 'Space Mono',monospace;">
                  Placed on ${new Date(order.createdAt).toLocaleDateString()}
                </p>
              </div>
              <span class="order-status ${statusClass}">${order.status.replace('_', ' ')}</span>
            </div>

            <div class="order-info">
              <div class="info-block">
                <div class="info-label">Tracking ID</div>
                <div class="info-value">${order.trackingId}</div>
              </div>
              <div class="info-block">
                <div class="info-label">Customer</div>
                <div class="info-value">${order.customerName}</div>
              </div>
              <div class="info-block">
                <div class="info-label">Email</div>
                <div class="info-value">${order.customerEmail}</div>
              </div>
              <div class="info-block">
                <div class="info-label">Total Amount</div>
                <div class="info-value" style="color:var(--accent);">$${order.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</div>
              </div>
            </div>

            <div class="divider"></div>

            <h3>📦 Order Items</h3>
            <div class="items-list">
              ${order.items.map(item => `
                <div class="item-row">
                  <span>${item.name} (×${item.quantity})</span>
                  <span>$${(item.price * item.quantity).toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                </div>
              `).join('')}
              <div style="border-top:1px solid var(--line); padding-top:12px; margin-top:12px;">
                <div class="item-row" style="margin:8px 0;">
                  <span>Subtotal</span>
                  <span>$${subtotal.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                </div>
                <div class="item-row" style="margin:8px 0;">
                  <span>Tax (12%)</span>
                  <span>$${tax.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                </div>
                <div class="item-row" style="margin:8px 0;">
                  <span>Shipping</span>
                  <span>${shipping === 0 ? 'FREE' : '$' + shipping.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                </div>
                <div class="item-row" style="font-weight:700; color:var(--accent);">
                  <span>TOTAL</span>
                  <span>$${order.amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</span>
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <h3>📍 Shipping Address</h3>
            <div class="shipping-info">
              <p style="margin:0; line-height:1.6;">
                ${order.shippingAddress.company ? order.shippingAddress.company + '<br>' : ''}
                ${order.customerName}<br>
                ${order.shippingAddress.street}<br>
                ${order.shippingAddress.city}, ${order.shippingAddress.state} ${order.shippingAddress.postal}<br>
                ${order.shippingAddress.country}
              </p>
            </div>

            <div class="divider"></div>

            <h3>🚚 Delivery Status</h3>
            <div class="git-log">
              <div class="git-log-bar">
                <span class="git-log-dot"></span>
                <span>order_log --oneline | head -${timeline.length}</span>
              </div>
              <div class="git-log-body">
                ${timeline.map((item, index) => {
                  const hash = Math.random().toString(16).substring(2, 9);
                  const timestamp = new Date(item.date).toLocaleString();
                  return `
                    <div class="git-log-entry">
                      <div><span class="git-log-hash">${hash}</span> ${item.stage.toLowerCase().replace(/\\s+/g, '_')}: ${item.description}</div>
                      <div class="git-log-meta">// ${timestamp}</div>
                    </div>
                  `;
                }).join('')}
                <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--line);"><span style="color:var(--accent);">$</span> <span style="color:var(--accent); animation: blink 1s infinite;">_</span></div>
              </div>
            </div>

            ${order.status === 'awaiting_payment' ? `
              <div class="divider"></div>
              <h3>💳 Payment Instructions</h3>
              <div class="shipping-info" style="background:var(--panel); border-color:var(--accent);">
                <p style="color:var(--accent); margin:0 0 12px;"><strong>Bank Transfer Details:</strong></p>
                <p style="margin:0; line-height:1.8;">
                  Bank: ${order.instructions.bankDetails.bank}<br>
                  Account: ${order.instructions.bankDetails.account}<br>
                  Swift: ${order.instructions.bankDetails.swift}<br>
                  <br>
                  <strong>Reference Number:</strong> ${order.orderId}
                </p>
              </div>
            ` : ''}
          </div>
        `;

        return html;
      }

      function searchOrder() {
        const orderId = document.getElementById('searchOrderId').value.trim();
        if (!orderId) {
          alert('Please enter an Order ID');
          return;
        }

        const orders = JSON.parse(localStorage.getItem('drlOrders')) || [];
        const order = orders.find(o => o.orderId === orderId);

        if (!order) {
          document.getElementById('orderContent').innerHTML = `
            <div style="text-align:center; padding:60px 20px;">
              <p style="color:#ff9999;">❌ Order not found</p>
              <p>Please check your Order ID and try again</p>
            </div>
          `;
          return;
        }

        displayOrder(order);
      }

      function displayOrder(order) {
        document.getElementById('orderContent').innerHTML = renderOrder(order);
      }

      function loadOrderFromURL() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');

        if (!orderId) return;

        const orders = JSON.parse(localStorage.getItem('drlOrders')) || [];
        const order = orders.find(o => o.orderId === orderId);

        if (order) {
          document.getElementById('searchOrderId').value = orderId;
          displayOrder(order);
        }
      }

      // Load order on page load
      window.addEventListener('load', loadOrderFromURL);

      // Simulate order status updates (demo only)
      setInterval(() => {
        const lastOrder = JSON.parse(localStorage.getItem('lastOrder'));
        if (lastOrder && lastOrder.status === 'paid') {
          // Auto-update status for demo
          const statuses = ['paid', 'processing', 'shipped', 'delivered'];
          const currentIndex = statuses.indexOf(lastOrder.status);
          if (currentIndex < statuses.length - 1) {
            lastOrder.status = statuses[currentIndex + 1];
            localStorage.setItem('lastOrder', JSON.stringify(lastOrder));
          }
        }
      }, 30000); // Update every 30 seconds for demo
    </script>
  </body>
</html>
