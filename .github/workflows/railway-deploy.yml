name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Deploy to Railway
        run: |
          curl -fsSL https://railway.app/install.sh | sh
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy using Railway CLI
        run: |
          railway deploy --service d-studio
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -f https://${{ secrets.RAILWAY_DOMAIN }}/health 2>/dev/null | grep -q '"ok":true'; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting for service to be ready... ($i/10)"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
        continue-on-error: true
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "🚀 Railway Deployment Complete"
          echo "Service: d-studio"
          echo "Domain: https://${{ secrets.RAILWAY_DOMAIN }}"
          echo "Status: ${{ job.status }}"
